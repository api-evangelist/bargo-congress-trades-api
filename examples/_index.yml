code_samples:
  description: First-party usage samples published by Bargo, one per supported client.
  samples:
    - language: shell
      source: https://www.bargo.ai/free-apis/congress
      code: 'curl "https://www.bargo.ai/free-apis/congress/v1/trades?ticker=NVDA&limit=5"'
    - language: shell
      source: https://github.com/bargo-ai/bargo-free-api-packages
      code: |
        curl -H "X-Api-Key: $BARGO_API_KEY" \
          "https://www.bargo.ai/free-apis/congress/v1/trades?chamber=senate&type=buy&limit=10"
    - language: javascript
      source: https://github.com/bargo-ai/bargo-free-api-packages/blob/main/docs/javascript.md
      code: |
        import { BargoCongressClient } from "@bargo-ai/congress";

        const client = new BargoCongressClient({ apiKey: process.env.BARGO_API_KEY });
        const { trades } = await client.tickerTrades("NVDA", { limit: 5 });
        for (const t of trades) {
          console.log(t.member, t.type, t.amount_range, t.transaction_date);
        }
    - language: python
      source: https://github.com/bargo-ai/bargo-free-api-packages/blob/main/docs/python.md
      code: |
        from bargo_congress import BargoCongressClient

        client = BargoCongressClient()  # or BargoCongressClient(api_key="...")
        data = client.ticker_trades("NVDA", limit=5)
        for trade in data["trades"]:
            print(trade["member"], trade["type"], trade["amount_range"], trade["transaction_date"])
    - language: html
      source: https://www.bargo.ai/free-apis/congress
      code: |
        <div data-congress-ticker="NVDA"></div>
        <script src="https://www.bargo.ai/free-apis/congress/embed.js" async></script>
