name: Bargo Congress Trades API
description: >-
  A free JSON REST API and hosted MCP server from Bargo that normalizes U.S. House and Senate STOCK Act
  securities transaction disclosures into a queryable dataset — currently 42,000+ disclosed trades across
  415 members and 4,100+ tickers. Six read-only GET operations cover trades (filterable by ticker, member,
  chamber, transaction type and date range), a member roster, per-member disclosure histories, aggregate
  statistics, and a dataset-freshness health check. Unusually for a free congressional-trading tracker,
  every row carries per-trade price performance — estimated price at the trade, latest price, and percent
  move since. Records are parsed and deduplicated from the official U.S. House Clerk Financial Disclosure
  reports and Senate eFD Periodic Transaction Reports, so disclosures lag transactions by up to ~45 days.
  Access is anonymous by default at a lower quota; a free no-card API key raises limits and unlocks a
  focused three-tool MCP server for agents. Open CORS, an embeddable browser widget, and first-party
  JavaScript and Python clients. Attribution is required; bulk redistribution of raw records is not permitted.
