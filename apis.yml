- name: Congress Trades MCP Server
  description: >-
    A focused Streamable HTTP MCP server exposing three read-only tools over the Congress Trades dataset
    — get_congress_trades, get_congress_member and get_congress_stats. The handshake and tools/list are
    anonymous; tool calls require a free fak_ key via X-Api-Key, Bearer, or a token query parameter. An
    official Docker image bridges stdio-only MCP clients to it.
