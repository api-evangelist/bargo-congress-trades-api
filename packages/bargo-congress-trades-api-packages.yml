description: >-
  Bargo ships first-party client libraries for the Congress Trades API from a
  single public monorepo, bargo-ai/bargo-free-api-packages. Both clients are
  dependency-free, MIT licensed, and version 0.1.0 (first published
  2026-07-30). The npm package is dual-published to JSR. A Docker image
  bridging stdio MCP clients to the hosted Congress MCP endpoint is published
  under the same org; it is catalogued here as a distributed artifact, with its
  command surface described in mcp/bargo-congress-trades-api-mcp.yml.
repository: https://github.com/bargo-ai/bargo-free-api-packages
packages:
  - language: javascript
    registry: npm
    name: "@bargo-ai/congress"
    version: 0.1.0
    url: https://www.npmjs.com/package/@bargo-ai/congress
    install: npm install @bargo-ai/congress
    license: MIT
    official: true
    typed: true
    esm: true
    engines: node >=18
    source: https://github.com/bargo-ai/bargo-free-api-packages/tree/main/packages/npm
    docs: https://github.com/bargo-ai/bargo-free-api-packages/blob/main/docs/javascript.md
    entrypoints: [BargoCongressClient, createClient]
  - language: typescript
    registry: jsr
    name: "@bargo-ai/congress"
    version: 0.1.0
    url: https://jsr.io/@bargo-ai/congress
    install: npx jsr add @bargo-ai/congress
    license: MIT
    official: true
    note: Same ESM source as the npm package, dual-published to JSR.
  - language: python
    registry: pypi
    name: bargo-congress
    version: 0.1.0
    url: https://pypi.org/project/bargo-congress/
    install: pip install bargo-congress
    license: MIT
    official: true
    requires_python: '>=3.9'
    source: https://github.com/bargo-ai/bargo-free-api-packages/tree/main/packages/python
    docs: https://github.com/bargo-ai/bargo-free-api-packages/blob/main/docs/python.md
    entrypoints: [BargoCongressClient]
containers:
  - registry: dockerhub
    name: bargoai/congress-trades-mcp
    tag: latest
    url: https://hub.docker.com/r/bargoai/congress-trades-mcp
    official: true
    purpose: >-
      stdio-to-Streamable-HTTP MCP bridge for the hosted Congress MCP endpoint.
      Wraps mcp-remote; embeds no API key and no Congress records.
    run: docker run --rm -i -e BARGO_API_KEY="YOUR_KEY" bargoai/congress-trades-mcp:latest
