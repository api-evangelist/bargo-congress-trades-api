health_endpoint:
  url: https://www.bargo.ai/free-apis/congress/v1/health
  operation: getCongressApiHealth
  auth: none
  returns: [status, trades, latest_disclosure, note]
  note: >-
    Reports service liveness plus total row count and the most recent disclosure
    date, so an agent can detect a stale dataset. Declares security: [] — the
    only operation in the contract that accepts no credential at all.
