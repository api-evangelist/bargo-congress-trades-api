description: >-
  Lifecycle posture for the Bargo Congress Trades API. Versioning is explicit
  and machine-readable; everything downstream of it is absent. Bargo publishes
  no status page, no deprecation policy, no SLA and no changelog for this API,
  which is consistent with a free, no-card offering but leaves an integrator
  with no advance-notice channel for breaking change. What Bargo does publish
  instead is a liveness/freshness ENDPOINT, which answers "is the data current"
  but not "is the service degraded".
